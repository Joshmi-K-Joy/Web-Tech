<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo class selector</title>
    <style>
        /* Dynamic Pseudo class selector */
        a:link{
            color: chartreuse;
        }
        a:visited{
            color: black;
        }
        a:active{
            color: brown;
        }
        :hover{
            cursor: crosshair;
        }
        /* Dynamic Pseudo class selector */
        h1:first-child{
            color: aquamarine;
        }
        h1:last-child{
            background-color:blueviolet;

        }
        h1:nth-child(3){
            background-color: blue;
        }
        h1:first-of-type{
            background-color: black;
            color: white;
        }
        h1:last-of-type{
            background-color: chocolate;
        }
    </style>
</head>
<body>
    <a href="https://www.dior.com" target="_blank">Dior</a>
    <h1>Hello 1</h1>
    <h1>Hello 2</h1>
    <h1>Hello 3</h1>
    <h1>Hello 4</h1>
    <h1>Hello 5</h1>
</body>
</html>
