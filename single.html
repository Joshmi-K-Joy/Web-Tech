<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>single selector</title>
    <style>
        #Head{
            color: rgb(172, 118, 53);
            background-color:aquamarine;
        }
        .tt{
            background-color: blueviolet;
        }
        u{
            background-color: blue;
        }
        h3,b,i{
            background-color: rgb(108, 155, 61);
        }
        *{
            background-color: black;
            color: white;
        }
    </style>
</head>
<body>
   <h1 id="Head">Hello 1</h1>
   <h1>Hello 2</h1>
   <h1 class="tt">Hello 3</h1>
   <h1>Hello 4</h1>
   <h1 class="tt">Hello 5</h1> 
   <u>Underline</u>
   <i>Italic</i>
   <h3>Heading 3</h3>
   <b>Bold</b>
</body>
</html>
