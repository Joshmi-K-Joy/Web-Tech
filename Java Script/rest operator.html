<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rest operator</title>
</head>
<body>
    <script>function number(...n){
        let sum=0
        for(i of n){
            sum=sum+i
        }
        console.log(sum);
        
    }
    number(10,20,30,40,50)
    
    </script>
</body>
