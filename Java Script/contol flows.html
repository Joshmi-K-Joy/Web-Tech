<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control flows</title>
</head>
<body>
    <script>
        var marks=prompt("Enter the marks: ")
        if(marks>=90){
            console.log("S Grade");
            
        }elseif(marks>=70 && marks<=89){
            console.log("A Grade");
            
        }elseif(marks>=40 && marks<=69){
            console.log("B Grade");
            
        }else{
            console.log("Failed");
            
        }
    </script>
</body>
</html>
