<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch case</title>
</head>
<body>
    <script>
        var today=new Date()
        var day=today.getDay()

        switch(day){
            case 0:
                console.log("sunday");
                break
            case 1:
                console.log("Mon");
                break
            case 2:
                console.log("Tue");
                break
            case 3:
                console.log("Wed");
                break
            case 4:
                console.log("Thur");
                break
            case 5:
                console.log("Fri");
                break
            case 6:
                console.log("Sat");
                break
            default:
                console.log("Invalid");
                
        }
        
    </script>
</body>
</html>
