<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task nav-bar</title>
    <style>
        *{
            padding: 0; margin: 0;
        }
        .nav_bar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 75px;
            background-color: black;
            color: white;
        }
        .left{
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            width: 30%;
        }
        .right{
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            width: 30%;
        }

        .nav_bar1{
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 75px;
            background-color: blue;
            color: white;
        }
        .left1{
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            width: 30%;
        }
        .right1{
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            width: 30%;
        }

        .nav_bar2{
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 75px;
            background-color: paleturquoise;
            color: black;
        }
        .left2{
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            width: 30%;
        }
        .right2{
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            width: 30%;
        }

    </style>
</head>
<body>
    <div class="nav_bar">

        <div class="left">
            <h2>Brand</h2>
            <h2>Home</h2>
            <h2>About</h2>
            <h2>Products</h2>
        </div>

        <div class="right">
            <input type="text" placeholder="Search">
            <h2>Search</h2>
        </div>
    </div>

    <br>

    <div class="nav_bar1">

        <div class="left1">
            <h2>Brand</h2>
            <h2>Home</h2>
            <h2>About</h2>
            <h2>Products</h2>
        </div>

        <div class="right1">
            <input type="text" placeholder="Search">
            <h2>Search</h2>
        </div>
    </div>

    <br>

    <div class="nav_bar2">

        <div class="left2">
            <h2>Brand</h2>

            <h2>Products</h2>
        </div>

</body>
</html>
