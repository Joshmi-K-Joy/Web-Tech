<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        .box{
            height: 250px;
            width: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid red;
        }
        h2{
            border: 2px solid blue;
            padding: 20px;
            margin: 10px 30px 20px 10px;
        }
        
        </style>
</head>
<body>
    <div class="box">
        <h2>Hello</h2>
    </div>
</body>
</html>
